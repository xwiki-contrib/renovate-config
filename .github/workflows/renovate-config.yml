## Validate the inherited configuration on every change: Renovate applies it to every xwiki-contrib
## repository, and does not report an invalid one anywhere visible, it just stops working on all of
## them. It is validated as global configuration because it holds options (onboarding, requireConfig)
## that only global and inherited configurations accept. --strict also fails on a deprecated option
## that Renovate would otherwise silently migrate.
name: Renovate configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the inherited configuration
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict org-inherited-config.json
